services:
  - type: web
    name: discord-command-center
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/status
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DISCORD_TOKEN
        sync: false
      - key: CONTROL_SERVER_ID
        sync: false
      - key: CONTROL_CHANNEL_ID
        sync: false
      - key: USE_TURSO
        value: "true"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: discord_agent_db
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: DISCORD_REDIRECT_URI
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: BULK_PROMO_ENABLED
        value: "true"
      - key: PROMO_MAX_CHANNELS
        value: "100"
      - key: MARKET_IMAGE_COMPANY_WEBADDRESS
        value: https://www.spikesignals.com/
      - key: MARKET_IMAGE_BRAND_NAME
        value: https://www.spikesignals.com/
      - key: LOG_LEVEL
        value: INFO
      - key: HEADLESS
        value: "true"
      - key: S3_ENABLED
        value: "true"
      - key: S3_BUCKET_NAME
        sync: false
      - key: S3_JSON_KEY
        value: "latest_news.json"
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: "us-east-1"
      - key: S3_PUBLIC_URL
        sync: false
      - key: X_AUTH_TOKEN
        sync: false
      - key: ATTACH_IMAGE
        value: "true"
      - key: DRY_RUN
        sync: false
